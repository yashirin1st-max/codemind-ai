
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMind AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
  color: #202123;
}

.app {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

/* SIDEBAR */

.sidebar {
  width: 270px;
  min-width: 270px;
  background: #f5f5f5;
  padding: 16px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #eee;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 24px;
}

.logo span {
  color: #3984e8;
}

.new-chat {
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  cursor: pointer;
  text-align: left;
  font-size: 15px;
}

.history-title {
  margin: 25px 0 12px;
  font-size: 13px;
  color: #777;
  font-weight: bold;
}

.history-list {
  overflow-y: auto;
  flex: 1;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 10px;
  border-radius: 9px;
  cursor: pointer;
  margin-bottom: 5px;
  font-size: 14px;
}

.history-item:hover,
.history-item.active {
  background: #e7e7e7;
}

.history-name {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.delete-chat {
  border: none;
  background: transparent;
  color: #888;
  font-size: 17px;
  cursor: pointer;
  padding: 3px;
}

.sidebar-info {
  padding-top: 12px;
  color: #888;
  font-size: 12px;
}

/* MAIN */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  padding: 16px;
  border-bottom: 1px solid #eee;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-btn {
  display: none;
  border: none;
  background: transparent;
  font-size: 23px;
  cursor: pointer;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.welcome {
  margin: auto;
  text-align: center;
}

.welcome h1 {
  font-size: 29px;
}

.welcome p {
  color: #777;
}

.message {
  max-width: 750px;
  width: fit-content;
  padding: 13px 16px;
  border-radius: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #edf2f8;
  align-self: flex-end;
}

.ai {
  background: #f7f7f7;
  align-self: flex-start;
}

/* INPUT */

.input-area {
  padding: 15px;
  border-top: 1px solid #eee;
}

.input-box {
  max-width: 800px;
  margin: auto;
  display: flex;
  border: 1px solid #ddd;
  border-radius: 15px;
  padding: 8px;
  gap: 8px;
}

.input-box textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  font-size: 16px;
  padding: 10px;
  min-width: 0;
  font-family: inherit;
}

.send {
  border: none;
  border-radius: 10px;
  background: #3984e8;
  color: white;
  padding: 12px 17px;
  cursor: pointer;
}

.note {
  text-align: center;
  color: #999;
  font-size: 11px;
  margin-top: 10px;
}

/* MOBILE */

@media(max-width:650px) {
  .sidebar {
    position: fixed;
    z-index: 10;
    left: -280px;
    top: 0;
    bottom: 0;
    transition: left .25s;
  }

  .sidebar.open {
    left: 0;
  }

  .menu-btn {
    display: block;
  }

  .chat {
    padding: 15px;
  }

  .welcome h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      CodeMind <span>AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      + Yangi suhbat
    </button>

    <div class="history-title">
      Suhbatlar tarixi
    </div>

    <div class="history-list" id="historyList">
    </div>

    <div class="sidebar-info">
      CodeMind AI V1.1
    </div>

  </aside>

  <main class="main">

    <header class="header">
      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      CodeMind AI
    </header>

    <section class="chat" id="chat">
    </section>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Dasturlash bo‘yicha savolingizni yozing..."
        ></textarea>

        <button class="send" onclick="sendMessage()">
          ↑
        </button>

      </div>

      <div class="note">
        CodeMind AI — Your Programming Assistant
      </div>

    </div>

  </main>

</div>

<script>

// STORAGE

const STORAGE_KEY = "codemind_conversations";

let conversations = [];
let currentChatId = null;

const chat = document.getElementById("chat");
const promptInput = document.getElementById("prompt");
const historyList = document.getElementById("historyList");
const sidebar = document.getElementById("sidebar");

// LOAD DATA

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    conversations = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(conversations)) {
      conversations = [];
    }

    conversations = conversations.filter(item =>
      item &&
      typeof item.id === "string" &&
      Array.isArray(item.messages)
    );

  } catch (error) {
    conversations = [];
  }

  if (conversations.length > 0) {
    currentChatId = conversations[0].id;
  } else {
    createChat();
  }

  saveData();
  renderHistory();
  renderChat();
}

// SAVE DATA

function saveData() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(conversations)
    );
  } catch (error) {
    alert("Xotiraga saqlashda muammo yuz berdi.");
  }
}

// CREATE CHAT

function createChat() {
  const id = Date.now().toString() +
    Math.random().toString(36).slice(2);

  const newConversation = {
    id: id,
    title: "Yangi suhbat",
    messages: []
  };

  conversations.unshift(newConversation);

  currentChatId = id;

  saveData();
  renderHistory();
  renderChat();
}

// CURRENT CHAT

function getCurrentChat() {
  return conversations.find(
    item => item.id === currentChatId
  );
}

// NEW CHAT

function newChat() {
  createChat();
  sidebar.classList.remove("open");
}

// ADD MESSAGE

function addMessage(text, type) {
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

// RENDER CHAT

function renderChat() {
  chat.innerHTML = "";

  const current = getCurrentChat();

  if (!current || current.messages.length === 0) {

    const welcome = document.createElement("div");

    welcome.className = "welcome";

    const heading = document.createElement("h1");
    heading.textContent = "CodeMind AI 👋";

    const paragraph = document.createElement("p");
    paragraph.textContent =
      "Sizning dasturlash bo‘yicha AI yordamchingiz.";

    welcome.append(heading, paragraph);
    chat.appendChild(welcome);

    return;
  }

  current.messages.forEach(message => {
    addMessage(message.text, message.type);
  });
}

// SEND MESSAGE

function sendMessage() {
  const text = promptInput.value.trim();

  if (!text) return;

  const current = getCurrentChat();

  if (!current) return;

  current.messages.push({
    text: text,
    type: "user"
  });

  if (current.title === "Yangi suhbat") {
    current.title = text.slice(0, 35);
  }

  promptInput.value = "";

  saveData();
  renderChat();
  renderHistory();

  // Hozircha AI modeli ulanmagan

  const answer =
    "CodeMind AI interfeysi ishlayapti! " +
    "Hozircha AI modeli ulanmagan. " +
    "Keyingi bosqichda Qwen Coder modelini ulaymiz.";

  current.messages.push({
    text: answer,
    type: "ai"
  });

  saveData();
  renderChat();
}

// RENDER HISTORY

function renderHistory() {
  historyList.innerHTML = "";

  conversations.forEach(item => {

    const row = document.createElement("div");

    row.className = "history-item";

    if (item.id === currentChatId) {
      row.classList.add("active");
    }

    const name = document.createElement("span");
    name.className = "history-name";
    name.textContent = "💬 " + item.title;

    name.onclick = () => openChat(item.id);

    const remove = document.createElement("button");

    remove.className = "delete-chat";
    remove.textContent = "×";
    remove.title = "Suhbatni o‘chirish";

    remove.onclick = event => {
      event.stopPropagation();
      deleteChat(item.id);
    };

    row.append(name, remove);

    historyList.appendChild(row);

  });
}

// OPEN CHAT

function openChat(id) {
  currentChatId = id;

  renderChat();
  renderHistory();

  sidebar.classList.remove("open");
}

// DELETE CHAT

function deleteChat(id) {

  if (!confirm("Ushbu suhbatni o‘chirmoqchimisiz?")) {
    return;
  }

  conversations = conversations.filter(
    item => item.id !== id
  );

  if (currentChatId === id) {
    if (conversations.length > 0) {
      currentChatId = conversations[0].id;
    } else {
      currentChatId = null;
      createChat();
      return;
    }
  }

  saveData();
  renderHistory();
  renderChat();
}

// SIDEBAR

function toggleSidebar() {
  sidebar.classList.toggle("open");
}

// ENTER TO SEND

promptInput.addEventListener("keydown", function(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();
    sendMessage();
  }

});

// START

loadData();

</script>

</body>
  </html>
