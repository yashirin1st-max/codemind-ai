<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071326">
<meta name="description" content="AIbek — aqlli dasturlash yordamchisi">
<link rel="manifest" href="./manifest.json">
<title>AIbek — Dasturlash yordamchisi</title>
<style>
:root{color-scheme:dark;--bg:#071326;--panel:rgba(18,38,67,.72);--line:rgba(161,196,255,.15);--muted:#9bb0ca;--blue:#5aa8ff;--cyan:#65e0e2}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 12% 0%,#173d68 0,transparent 38%),radial-gradient(ellipse at 95% 90%,#123d54 0,transparent 36%),var(--bg);color:#eef6ff;font:15px/1.5 system-ui,sans-serif}
button,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100dvh;display:grid;grid-template-columns:260px 1fr;max-width:1450px;margin:auto;padding:14px;gap:14px}
.sidebar,.topbar,.composer,.welcome-card,.message,.quick button{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px #0002}
.sidebar{border-radius:23px;padding:17px;display:flex;flex-direction:column;min-height:calc(100dvh - 28px)}
.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;margin:3px 0 25px}.logo{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#5aa8ff,#63e1df);color:#06172c;font-weight:900;font-size:21px}.brand span{color:var(--cyan)}
.btn{border:1px solid var(--line);background:#ffffff0a;border-radius:13px;padding:11px 13px;text-align:left}.btn.primary{background:linear-gradient(110deg,#398ff0,#39b9ca);border:0;color:#04182b;font-weight:750}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:25px 8px 10px}.history{overflow:auto;flex:1}.history-empty{color:#8298b5;font-size:13px;padding:8px}.history-item{padding:10px;border-radius:11px;color:#cbd9ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history-item.active,.history-item:hover{background:#ffffff12}.side-bottom{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column;min-height:calc(100dvh - 28px)}.topbar{height:60px;border-radius:18px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top-left{display:flex;align-items:center;gap:10px;font-weight:700}.status{font-size:11px;color:#a8c3dc;border:1px solid var(--line);border-radius:20px;padding:5px 9px}.top-actions{display:flex;align-items:center;gap:8px}.select{max-width:150px;background:#0c2039;color:#eaf4ff;border:1px solid var(--line);padding:8px;border-radius:10px}.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#ffffff0a}
.chat{flex:1;overflow:auto;padding:25px 10px 16px;display:flex;flex-direction:column;gap:15px}.welcome{max-width:780px;width:100%;margin:auto;text-align:center;padding:25px 10px}.orb{width:65px;height:65px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;font-size:29px;background:linear-gradient(135deg,#5aa8ff,#65e0e2);color:#071326;box-shadow:0 12px 38px #55b9e755}.welcome h1{font-size:clamp(27px,5vw,42px);line-height:1.12;margin:0 0 12px}.gradient{background:linear-gradient(90deg,#83bcff,#75eeee);background-clip:text;color:transparent}.welcome p{color:var(--muted);margin:0 auto 24px;max-width:510px}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:650px;margin:auto}.quick button{text-align:left;border-radius:15px;padding:14px;color:#dcecff}.quick button b{display:block;margin-bottom:3px}.quick button small{color:var(--muted)}
.message{max-width:min(800px,90%);padding:13px 16px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:linear-gradient(120deg,#1b5790,#166f86);border-color:#65c7ef33}.message.ai{align-self:flex-start}.message .who{font-size:11px;color:#a8c7e8;margin-bottom:5px;font-weight:700}
.composer-wrap{padding:0 8px 8px}.composer{max-width:900px;margin:auto;border-radius:20px;padding:10px}.composer textarea{display:block;width:100%;min-height:56px;max-height:180px;resize:vertical;background:transparent;border:0;outline:0;color:#f1f7ff;padding:8px 9px}.composer textarea::placeholder{color:#8098b6}.compose-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 1px}.small-btn{border:1px solid var(--line);background:#ffffff0a;border-radius:10px;padding:7px 10px;font-size:12px;color:#c9d9ed}.send{border:0;border-radius:12px;padding:9px 17px;background:linear-gradient(110deg,#58a8ff,#65dfdf);color:#04172b;font-weight:800}.footnote{text-align:center;color:#7189a8;font-size:10px;padding:8px}
@media(max-width:760px){.app{display:block;padding:8px}.sidebar{display:none}.main{min-height:calc(100dvh - 16px)}.topbar{height:55px}.chat{padding:14px 2px}.welcome{padding:17px 3px}.quick{grid-template-columns:1fr}.quick button{padding:11px}.message{max-width:96%}.select{max-width:120px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">A</div><div>AI<span>bek</span></div></div><button class="btn primary" id="newChat">＋ Yangi suhbat</button><div class="side-label">Suhbatlar tarixi</div><div class="history" id="history"><div class="history-empty">Hozircha suhbat yo‘q</div></div><div class="side-bottom">AIbek · Dasturlash yordamchisi<br>Interfeys 1.0</div></aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="icon-btn" id="menu" aria-label="Menyu">☰</button><span>AIbek</span><span class="status" id="status">AI serveri ulanmagan</span></div><div class="top-actions"><select class="select" id="mode" aria-label="Ishlash rejimi"><option value="auto">Avtomatik</option><option value="online">Onlayn</option><option value="offline">Oflayn</option></select><button class="icon-btn" id="clear" title="Suhbatni tozalash">↺</button></div></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="orb">✦</div><h1>Salom! Men <span class="gradient">AIbek</span></h1><p>Dasturlash, kod tahlili va loyiha yaratishda yordamchingiz. Nima yaratamiz?</p><div class="quick"><button data-prompt="Menga Python dasturlashni o‘rgatishni boshlang."><b>⌘ Python o‘rganish</b><small>Bosqichma-bosqich tushuntirish</small></button><button data-prompt="Ushbu koddagi xatolarni topib, tuzatishga yordam bering:"><b>⌕ Xatoni topish</b><small>Kodni tahlil qilish</small></button><button data-prompt="Menga zamonaviy web loyiha tuzib bering. Avval rejasini va fayllar tuzilishini ko‘rsating."><b>▧ Loyiha yaratish</b><small>G‘oyadan kodgacha</small></button><button data-prompt="Quyidagi kodni sodda qilib tushuntirib bering:"><b>⌁ Kodni tushuntirish</b><small>Qadam-baqadam izoh</small></button></div></div></section>
<div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="2" placeholder="AIbek’ka vazifangizni yozing..."></textarea><div class="compose-bottom"><div><label class="small-btn" for="file">＋ Fayl</label><input id="file" type="file" hidden accept=".txt,.js,.py,.html,.css,.json,.md,.java,.cpp,.ts"><span id="fileName" style="font-size:11px;color:#91a8c4"></span></div><button class="send" id="send">Yuborish ↑</button></div></div><div class="footnote">AI javoblarini muhim loyihalarda tekshirib oling.</div></div>
</main></div>
<script>
const $=s=>document.querySelector(s),chat=$('#chat'),promptBox=$('#prompt');let chats=[],active=0;
function fresh(){chats.unshift({title:'Yangi suhbat',messages:[]});active=0;render()}
function render(){chat.innerHTML='';let c=chats[active];if(!c||!c.messages.length){chat.innerHTML=$('#welcome').outerHTML;chat.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{promptBox.value=b.dataset.prompt;promptBox.focus()})}else c.messages.forEach(m=>bubble(m.text,m.role));history()}
function history(){let h=$('#history');h.innerHTML=chats.map((c,i)=>'<div class="history-item '+(i===active?'active':'')+'" data-i="'+i+'"></div>').join('');h.querySelectorAll('[data-i]').forEach(e=>{e.textContent=chats[+e.dataset.i].title;e.onclick=()=>{active=+e.dataset.i;render()}})}
function bubble(t,r){let d=document.createElement('div');d.className='message '+(r==='user'?'user':'ai');let w=document.createElement('div');w.className='who';w.textContent=r==='user'?'Siz':'AIbek';let p=document.createElement('div');p.textContent=t;d.append(w,p);chat.append(d);chat.scrollTop=chat.scrollHeight}
async function send(){let t=promptBox.value.trim();if(!t)return;let c=chats[active];c.messages.push({role:'user',text:t});if(c.title==='Yangi suhbat')c.title=t.slice(0,30);promptBox.value='';render();bubble('AI serveri hali ulanmagan. Interfeys tayyor; keyingi bosqichda xavfsiz backend va model ulanadi. API kalitni bu sahifaga yozmang.','assistant');c.messages.push({role:'assistant',text:'AI serveri hali ulanmagan. Interfeys tayyor; keyingi bosqichda xavfsiz backend va model ulanadi. API kalitni bu sahifaga yozmang.'});history()}
$('#send').onclick=send;promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#newChat').onclick=fresh;$('#clear').onclick=()=>{chats[active].messages=[];render()};$('#menu').onclick=()=>alert('Suhbatlar tarixi hozircha katta ekran panelida ko‘rinadi.');$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;$('#fileName').textContent=' '+f.name;let rd=new FileReader();rd.onload=()=>promptBox.value+='\\n\\n[Fayl: '+f.name+']\\n'+String(rd.result).slice(0,12000);rd.readAsText(f)};$('#mode').onchange=e=>{if(e.target.value==='offline')alert('Oflayn AI modeli hali o‘rnatilmagan.');};fresh();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
